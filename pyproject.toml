[project]
name = "download-bot"
version = "0.1.0"
description = "Production-ready Telegram download bot with multi-provider support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.10,<4",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-json-logger>=2.0,<3",
    "structlog>=24.1,<25",
    "sqlalchemy>=2.0,<3",
    "asyncpg>=0.29,<1",
    "psycopg2-binary>=2.9,<3",
    "aiosqlite>=0.19,<1",
    "alembic>=1.13,<2",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "yt-dlp>=2024.1,<2025",
    "aiofiles>=23.2,<24",
    "python-multipart>=0.0.6,<1",
    "pyyaml>=6.0,<7",
    "redis>=5.0,<6",
    "tenacity>=8.2,<9",
    "prometheus-client>=0.19,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "pytest-mock>=3.14,<4",
    "httpx>=0.27,<1",
    "faker>=25.1,<26",
    "ruff>=0.4,<1",
    "black>=24.3,<25",
    "isort>=5.13,<6",
    "mypy>=1.10,<2",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "detect-secrets>=1.5,<2",
    "pre-commit>=3.7,<4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E", "F", "I", "UP", "W", "C4", "C90", "PL", "RUF", "T20", "PYI", "PTH", "ERA", "PD", "PGH", "SIM", "TID", "TRY", "NPY", "ARG", "FLY", "PERF", "RET", "SLF", "SLOT", "TRY", "INT", "LOG"
]
ignore = ["S101", "S311", "S603", "S607"]
per-file-ignores = { "tests/*" = ["S101", "S311", "S603", "S607", "PLR2004"], "scripts/*" = ["S101", "S311", "S603", "S607"] }
exclude = [".venv", ".git", "__pycache__", "build", "dist", ".mypy_cache", ".ruff_cache", "htmlcov", ".pytest_cache"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
  \.git
  | \.venv
  | __pycache__
  | \.mypy_cache
  | \.ruff_cache
  | build
  | dist
  | htmlcov
  | \.pytest_cache
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mpy_path = "."

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --strict-config"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "scripts/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
precision = 2

[tool.bandit]
exclude_dirs = ["tests", "scripts", "__pycache__", ".venv", ".git", "build", "dist"]
skips = ["B101", "B311", "B603", "B607"]

[tool.detect-secrets]
exclude-files = [
    ".*\\.pyc$",
    ".*\\.pyo$",
    ".*/__pycache__/.*",
    ".*\\.git/.*",
    ".*\\.venv/.*",
    ".*\\.mypy_cache/.*",
    ".*\\.ruff_cache/.*",
    ".*\\.pytest_cache/.*",
    ".*/htmlcov/.*",
    ".*/build/.*",
    ".*/dist/.*",
    ".*\\.secrets\\.baseline$",
]
plugins = [
    {name = "ArtifactoryDetector", enabled = true},
    {name = "AWSKeyDetector", enabled = true},
    {name = "AzureStorageKeyDetector", enabled = true},
    {name = "BasicAuthDetector", enabled = true},
    {name = "CloudantDetector", enabled = true},
    {name = "DiscordBotTokenDetector", enabled = true},
    {name = "GitHubTokenDetector", enabled = true},
    {name = "GitLabTokenDetector", enabled = true},
    {name = "HerokuApiKeyDetector", enabled = true},
    {name = "IbmCloudApiKeyDetector", enabled = true},
    {name = "IbmCosHmacDetector", enabled = true},
    {name = "JwtTokenDetector", enabled = true},
    {name = "JiraApiTokenDetector", enabled = true},
    {name = "MailchimpApiKeyDetector", enabled = true},
    {name = "NpmDetector", enabled = true},
    {name = "OpenAiApiKeyDetector", enabled = true},
    {name = "PrivateKeyDetector", enabled = true},
    {name = "PypiTokenDetector", enabled = true},
    {name = "SendGridApiKeyDetector", enabled = true},
    {name = "SlackDetector", enabled = true},
    {name = "SoftlayerDetector", enabled = true},
    {name = "SquareOAuthDetector", enabled = true},
    {name = "StripeDetector", enabled = true},
    {name = "TelegramBotTokenDetector", enabled = true},
    {name = "TwilioApiKeyDetector", enabled = true},
]